services:
  - type: worker
    name: cdsfusion-telegram-test
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: false
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATA_DIR
        value: core/var/data
      - key: BOT_INSTANCE
        value: production
      - key: NODE_VERSION
        value: "20.18.1"
